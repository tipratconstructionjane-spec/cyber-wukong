<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-WUKONG // DEITY LOGIN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <!-- LOGIN CONTAINER BOX -->
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo-area">
                <h1 class="logo">CYBER-WUKONG</h1>
                <p>AUTHENTICATION PROTOCOL // V.MAX</p>
            </div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label>รหัสประจำตัวไซเบอร์ (Username)</label>
                    <input type="text" placeholder="ระบุชื่อผู้ใช้งาน..." class="login-input" required>
                </div>

                <div class="form-group">
                    <label>รหัสผ่านมหาเทพ (Password)</label>
                    <input type="password" placeholder="••••••••••••" class="login-input" required>
                </div>

                <button type="submit" class="btn-play login-btn">เข้าสู่ระบบมหาเทพ (LOGIN)</button>
            </form>

            <div class="login-footer">
                <p>ยังไม่มีบัญชีสมาชิก? <a href="register.html" style="color: var(--accent-orange); text-decoration: none;">สมัครสมาชิก / เติมเงิน</a></p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
