<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ช่องกีฬา - ซุนหงอคง</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-white font-sans">

    <nav class="bg-[#121212] border-b border-gray-800 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-8">
            <a href="index.html" class="text-2xl font-bold text-orange-500 tracking-wider">ซุนหงอคง</a>
            <ul class="hidden md:flex items-center gap-6 text-sm font-medium">
                <li><a href="index.html" class="hover:text-orange-400">หน้าแรก</a></li>
                <li><a href="football.html" class="hover:text-orange-400">ฟุตบอลสด</a></li>
                <li><a href="sports.html" class="text-orange-500 font-bold">ช่องกีฬา</a></li>
                <li><a href="tv.html" class="hover:text-orange-400">ทีวี</a></li>
            </ul>
        </div>
        <div class="flex items-center gap-4">
            <a href="index.html" class="text-sm font-medium text-gray-300 hover:text-white">กลับหน้าแรก</a>
        </div>
    </nav>

    <main class="p-6 max-w-7xl mx-auto">
        <div class="mb-8">
            <h1 class="text-3xl font-extrabold text-orange-500 flex items-center gap-3">
                <span>⚡</span> ช่องกีฬาทั้งหมด (Sports Channels)
            </h1>
            <p class="text-gray-400 text-sm mt-1">รวมช่องกีฬาดังระดับโลก ถ่ายทอดสดคมชัด 24 ชั่วโมง</p>
        </div>

        <div id="sports-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
            </div>
    </main>

    <script>
        // ข้อมูลรายชื่อช่องกีฬาและชื่อไฟล์รูป (เพื่อนสามารถนำชื่อไฟล์จริง 44 ไฟล์มาใส่เพิ่มตรงนี้ได้เลย)
        const sportsChannels = [
            { name: "BeIN Sports 1", image: "images/bein1.jpg" },
            { name: "BeIN Sports 2", image: "images/bein2.jpg" },
            { name: "BeIN Sports 3", image: "images/bein3.jpg" },
            { name: "MAX 1", image: "images/MAX1.jpg" },
            { name: "MAX 2", image: "images/MAX2.jpg" },
            { name: "MAX 3", image: "images/MAX3.jpg"},
            { name: "MAX 4", image: "images/MAX4.jpg" },
            { name: "MAX 5", image: "images/MAX5.jpg" },
            { name: "MAX 6", image: "images/MAX6.jpg"},
            { name: "MAX 7", image: "images/MAX7.jpg" },
            { name: "MAX 8", image: "images/MAX8.jpg" },
            { name: "MAX 9", image: "images/MAX9.jpg"},       
            { name: "MAX 10", image: "images/MAX10.jpg" },
            { name: "MAX 11", image: "images/MAX11.jpg" },
            { name: "MAX 12", image: "images/MAX12.jpg"},
            { name: "True HD1", image: "images/trueHD.jpg" },
            { name: "True HD2", image: "images/true2.jpg" },
            { name: "True HD3", image: "images/true3.jpg" },
            { name: "True HD4", image: "images/true4.jpg" },  
            { name: "True HD5", image: "images/true5.jpg" },
            { name: "True HD7", image: "images/true7.jpg" },
            { name: "True HD", image: "images/trueHD.jpg" },
            { name: "True tenis", image: "images/truetenis.jpg" }, 
            { name: "BUNDESLIGA", image: "images/BUNDESLIGA.jpg" },
            { name: "รีลมาดริด", image: "images/REALMADRID.jpg" },
            { name: "APT", image: "images/ATP.jpg" },
            { name: "EUROsports", image: "images/EUROsports.jpg" },
            { name: "FIGHT", image: "images/FIGHT.jpg" },
            { name: "GOLF", image: "images/GOF.jpg" },
            { name: "LFCTV", image: "images/LFCtv.jpg" }, 
            { name: "ONELUMPINEE", image: "images/ONELUMPINI.jpg" },
            { name: "PGA", image: "images/PGA.jpg" },
            { name: "SPORTTV1", image: "images/SPOTV.jpg" },
            { name: "SPORTTV2", image: "images/SPOTV2.jpg" },  
            { name: "WNB", image: "images/WNB.jpg" },         
                                      
            // สามารถเพิ่มข้อมูลช่องที่เหลือจนครบ 44 ช่องตรงนี้ได้เลยครับ
        ];

        // ฟังก์ชันสำหรับสร้างและแสดงผลการ์ดลงในหน้าเว็บ
        const gridContainer = document.getElementById('sports-grid');

        sportsChannels.forEach(channel => {
            const card = document.createElement('div');
            card.className = "bg-gray-900/80 border border-gray-800 hover:border-orange-500 rounded-2xl p-4 flex flex-col items-center justify-between transition transform hover:-translate-y-1 shadow-lg group cursor-pointer";
            
            card.innerHTML = `
                <div class="w-full h-28 flex items-center justify-center mb-4 bg-black/60 rounded-xl p-3 overflow-hidden">
                   <img src="${channel.image}" alt="${channel.name}" class="w-full h-full object-contain">
             </div>
                <h3 class="text-sm font-bold text-white text-center group-hover:text-orange-400 transition">${channel.name}</h3>
                <span class="text-[10px] bg-red-600/20 text-red-400 border border-red-500/30 px-2 py-0.5 rounded-full mt-2 font-semibold">Live 24 ชม.</span>
            `;
            
            gridContainer.appendChild(card);
        });
    </script>

</body>
</html>
