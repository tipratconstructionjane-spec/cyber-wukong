<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทีวีดิจิทัล - ซุนหงอคง</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-white font-sans">

    <nav class="bg-[#121212] border-b border-gray-800 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-8">
            <a href="index.html" class="text-2xl font-bold text-orange-500 tracking-wider">ซุนหงอคง</a>
            <ul class="hidden md:flex items-center gap-6 text-sm font-medium">
                <li><a href="index.html" class="hover:text-orange-400">หน้าแรก</a></li>
                <li><a href="football.html" class="hover:text-orange-400">ฟุตบอลสด</a></li>
                <li><a href="sports.html" class="hover:text-orange-400">ช่องกีฬา</a></li>
                <li><a href="tv.html" class="text-orange-500 font-bold">ทีวีดิจิทัล</a></li>
                <li><a href="movies.html" class="hover:text-orange-400">ภาพยนตร์</a></li>
            </ul>
        </div>
        <div class="flex items-center gap-4">
            <a href="index.html" class="text-sm font-medium text-gray-300 hover:text-white">กลับหน้าแรก</a>
        </div>
    </nav>

    <main class="p-6 max-w-7xl mx-auto">
        <div class="mb-8">
            <h1 class="text-3xl font-extrabold text-orange-500 flex items-center gap-3">
                <span>📺</span> ทีวีดิจิทัล (Digital TV)
            </h1>
            <p class="text-gray-400 text-sm mt-1">รวมช่องทีวีดิจิทัลและรายการยอดฮิต คมชัด 24 ชั่วโมง</p>
        </div>

        <div id="channels-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    </main>

    <script>
        const channelList = [
            { name: "ช่อง 3 HD", images: "images/nation/ch3.jpg" },
            { name: "ช่อง 7 HD", images: "images/nation/ch7.jpg" },
            { name: "ช่อง 2 HD", images: "images/nation/ch2.jpg" },
            { name: "ช่อง 5 HD", images: "images/nation/ch5.jpg" },
            { name: "ช่อง 8 HD", images: "images/nation/ch8.jpg" },
            { name: "ช่อง 4U HD", images: "images/nation/ch4u.jpg" },
            { name: "ช่อง 22 HD", images: "images/nation/ch22.jpg" },
            { name: "ช่อง 25 HD", images: "images/nation/ch25.jpg" },
            { name: "ช่อง 29 HD", images: "images/nation/ch29.jpg" },
            { name: "ช่อง 29 PLUS HD", images: "images/nation/ch29p.jpg" },
            { name: "ช่อง 31 HD", images: "images/nation/ch31.jpg" },
            { name: "ช่อง 30 HD", images: "images/nation/ch30.jpg" },
            { name: "ช่อง 34 HD", images: "images/nation/ch34.jpg" },
            { name: "ช่อง ไทยรัฐ HD", images: "images/nation/ch32.jpg" },
            { name: "ช่อง JKN HD", images: "images/nation/jkn.jpg" },
            { name: "ช่อง PBS HD", images: "images/nation/pbs.jpg" },
            { name: "ช่อง PPTV HD", images: "images/nation/pptv.jpg" },
            { name: "ช่อง TNN HD", images: "images/nation/tnn.jpg" },
            { name: "ช่อง TOPNEW HD", images: "images/nation/topnew.jpg" },
            { name: "ช่อง TSPORTs", images: "images/nation/tsports.jpg" },
            { name: "ช่อง WPK HD", images: "images/nation/wpk.jpg" }
        ];

        const gridContainer = document.getElementById('channels-grid');

        channelList.forEach(channel => {
            const card = document.createElement('div');
            card.className = "bg-gray-900/80 border border-gray-800 hover:border-orange-500 rounded-xl overflow-hidden shadow-lg transition duration-300 flex flex-col items-center p-3";
            card.innerHTML = `
                <div class="w-full aspect-video bg-black/40 rounded-lg overflow-hidden flex items-center justify-center mb-3">
                    <img src="${channel.images}" alt="${channel.name}" class="w-full h-full object-contain">
                </div>
                <h3 class="text-sm font-semibold text-white text-center mb-1">${channel.name}</h3>
                <span class="text-[10px] text-orange-400 bg-orange-500/10 px-2 py-0.5 rounded-full">Live 24 ชม.</span>
            `;
            gridContainer.appendChild(card);
        });
    </script>
</body>
</html>
