<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ซุนหงอคง - VIP 18+</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#121212] text-white font-sans min-h-screen">

    <!-- Navbar / Header -->
    <div class="p-6">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2 mb-1">
                    🔞 VIP 18+ (Exclusive)
                </h1>
                <p class="text-gray-400 text-sm">โซนพิเศษสำหรับสมาชิก รับชมความบันเทิงเต็มอิ่ม</p>
            </div>
            <span class="bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Restricted</span>
        </div>

        <!-- Grid แสดงผลรายการ 18+ -->
        <div id="vip-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- JavaScript เรนเดอร์การ์ด -->
        </div>
    </div>

    <script>
        // ข้อมูลรายการ VIP 18+ พร้อมลิงก์ไปยังหน้าเล่นวิดีโอ
        const vipData = [
            {
                title: "ชื่อคลิป / ภาพยนตร์ 1",
                category: "Exclusive 18+",
                badge: "VIP",
                badgeColor: "bg-red-700",
                image: "images/imagesmaster/poster1.jpg",
                videoPage: "play-video.html?id=1" // ลิงก์ไปหน้าเล่นวิดีโอเดี่ยว
            },
            {
                title: "ชื่อคลิป / ภาพยนตร์ 2",
                category: "Uncensored",
                badge: "HOT",
                badgeColor: "bg-rose-600",
                image: "images/imagesmaster/poster2.jpg",
                videoPage: "play-video.html?id=2"
            },
            // เพิ่มรายการอื่นๆ ตรงนี้ต่อได้เลยเพื่อน
        ];

        const vipGrid = document.getElementById('vip-grid');

        vipData.forEach(item => {
            const cardHTML = `
                <div class="bg-gray-900 rounded-lg overflow-hidden border border-gray-800 hover:border-gray-600 transition duration-300 group">
                    <div class="h-64 bg-gray-800 relative overflow-hidden flex items-center justify-center">
                        <span class="absolute top-2 right-2 ${item.badgeColor} text-xs px-2 py-0.5 rounded text-white font-bold">${item.badge}</span>
                        <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                    </div>
                    <div class="p-3 text-center">
                        <h3 class="font-semibold text-sm truncate">${item.title}</h3>
                        <p class="text-xs text-gray-400 mt-0.5">${item.category}</p>
                        <a href="${item.videoPage}" class="mt-2 block text-center bg-red-600 hover:bg-red-500 text-white text-xs py-1.5 rounded transition duration-200 font-medium">รับชมวิดีโอ</a>
                    </div>
                </div>
            `;
            vipGrid.innerHTML += cardHTML;
        });
    </script>

</body>
</html>
