<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-WUKONG - ระบบจัดการลิงก์หลังบ้าน (Admin Panel)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header หลังบ้าน -->
        <header class="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-xl">
            <div>
                <h1 class="text-xl font-bold text-amber-500">⚙️ CYBER-WUKONG ADMIN</h1>
                <p class="text-xs text-slate-400">ระบบจัดการลิงก์สตรีมบอลสดและตารางแข่งขัน</p>
            </div>
            <span class="bg-amber-500/20 text-amber-400 text-xs px-3 py-1 rounded-full font-semibold border border-amber-500/30">
                🟢 สถานะ: ออนไลน์
            </span>
            <a href="index.html" class="text-sm font-bold text-gray-900 bg-yellow-500 hover:bg-yellow-400 px-3 py-1.5 rounded flex items-center gap-1 transition">
                กลับหน้าหลัก
            </a>
            
        </header>

        <!-- ฟอร์มเพิ่ม/อัปเดตลิงก์บอลสด -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
            <h2 class="text-lg font-bold text-amber-400 mb-4 flex items-center">
                <i class="fa-solid fa-plus-circle mr-2"></i> เพิ่ม / อัปเดตช่องสตรีมบอลสด
            </h2>

            <form id="matchForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <!-- ทัวร์นาเมนต์ -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">ลีก / ทัวร์นาเมนต์</label>
                    <input type="text" id="league" placeholder="เช่น พรีเมียร์ลีก อังกฤษ" required 
                        class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-amber-500 outline-none">
                </div>

                <!-- เวลาแข่งขัน -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">เวลาเตะ</label>
                    <input type="text" id="matchTime" placeholder="เช่น 23:00 น. หรือ LIVE 45'" required 
                        class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-amber-500 outline-none">
                </div>

                <!-- ทีมเหย้า -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">ทีมเหย้า (Home)</label>
                    <input type="text" id="homeTeam" placeholder="เช่น อาร์เซนอล" required 
                        class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-amber-500 outline-none">
                </div>

                <!-- ทีมเยือน -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">ทีมเยือน (Away)</label>
                    <input type="text" id="awayTeam" placeholder="เช่น เชลซี" required 
                        class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-amber-500 outline-none">
                </div>

                <!-- URL ลิงก์สตรีมสด -->
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-1">URL ลิงก์สัญญาณสด (Stream Source URL / m3u8)</label>
                    <input type="url" id="streamUrl" placeholder="https://live.example.com/stream/ch1.m3u8" required 
                        class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-amber-300 focus:border-amber-500 outline-none">
                </div>

                <!-- สถานะการเปิดใช้งานลิงก์ -->
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-1">สถานะปุ่มเข้าชม</label>
                    <select id="linkStatus" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-amber-500 outline-none">
                        <option value="active">🟢 เปิดใช้งานปุ่มสตรีมสดทันที (LIVE)</option>
                        <option value="waiting">⏳ ล็อกปุ่ม (แสดง: ลิงก์จะเปิดก่อนแข่ง 30 นาที)</option>
                    </select>
                </div>

                <!-- ปุ่มส่งข้อมูล -->
                <div class="md:col-span-2 mt-2">
                    <button type="submit" class="w-full bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-slate-950 font-bold py-3 rounded-lg text-sm shadow-lg transition">
                        <i class="fa-solid fa-floppy-disk mr-2"></i> บันทึกข้อมูลแมตช์ & อัปเดตสัญญาณ
                    </button>
                </div>
            </form>
        </div>

        <!-- รายการแมตช์ที่จัดการอยู่ -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
            <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center">
                <i class="fa-solid fa-list-check mr-2 text-amber-500"></i> รายการคู่บอลทั้งหมดในระบบ
            </h2>
            <div id="activeMatchesList" class="space-y-3">
                <p class="text-xs text-slate-500 text-center py-4">ยังไม่มีแมตช์ที่ถูกบันทึกในระบบ</p>
            </div>
        </div>

    </div>

    <script>
        // แทนที่สคริปต์เดิมใน admin.html ด้วยชุดนี้ครับ
const matchForm = document.getElementById('matchForm');
const activeMatchesList = document.getElementById('activeMatchesList');

// ดึงข้อมูลเดิมที่มีอยู่ (ถ้ามี) หรือสร้างอาเรย์เปล่า
let matches = JSON.parse(localStorage.getItem('cyberWukongMatches')) || [];

renderMatches();

matchForm.addEventListener('submit', (e) => {
    e.preventDefault();
    
    const newMatch = {
        id: Date.now(),
        league: document.getElementById('league').value,
        time: document.getElementById('matchTime').value,
        home: document.getElementById('homeTeam').value,
        away: document.getElementById('awayTeam').value,
        url: document.getElementById('streamUrl').value,
        status: document.getElementById('linkStatus').value
    };

    matches.push(newMatch);
    
    // บันทึกลง localStorage เพื่อแชร์ข้อมูลข้ามหน้าเว็บ
    localStorage.setItem('cyberWukongMatches', JSON.stringify(matches));
    
    renderMatches();
    matchForm.reset();
    alert('✅ บันทึกและส่งลิงก์สตรีมไปยังหน้าบอลสดเรียบร้อยแล้ว!');
});

function renderMatches() {
    if (matches.length === 0) {
        activeMatchesList.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">ยังไม่มีแมตช์ที่ถูกบันทึกในระบบ</p>`;
        return;
    }

    activeMatchesList.innerHTML = matches.map(m => `
        <div class="bg-slate-800/60 border border-slate-700/60 rounded-lg p-3 flex justify-between items-center text-sm">
            <div>
                <span class="text-xs text-amber-400 font-semibold">[${m.league}]</span>
                <div class="font-bold text-slate-200">${m.home} vs ${m.away} (${m.time})</div>
                <div class="text-xs text-slate-400 truncate max-w-xs md:max-w-md">${m.url}</div>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-xs px-2 py-1 rounded font-bold ${m.status === 'active' ? 'bg-green-500/20 text-green-400' : 'bg-yellow-500/20 text-yellow-400'}">
                    ${m.status === 'active' ? 'LIVE' : 'WAITING'}
                </span>
                <button onclick="deleteMatch(${m.id})" class="text-red-400 hover:text-red-300 p-1">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>
        </div>
    `).join('');
}

function deleteMatch(id) {
    matches = matches.filter(m => m.id !== id);
    localStorage.setItem('cyberWukongMatches', JSON.stringify(matches));
    renderMatches();
}

    </script>
</body>
</html>
