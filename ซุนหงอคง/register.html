<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-WUKONG // REGISTER PROTOCOL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo-area">
                <h1 class="logo">CYBER-WUKONG</h1>
                <p>MEMBER REGISTRATION // V.MAX</p>
            </div>

            <form class="login-form" id="registerForm">
                <div class="form-group">
                    <label>ชื่อเล่นของคุณ (Nickname)</label>
                    <input type="text" placeholder="ระบุชื่อเล่น..." class="login-input" id="regName" required>
                </div>

                <div class="form-group">
                    <label>เบอร์โทรศัพท์ (Phone Number)</label>
                    <input type="tel" placeholder="089xxxxxxx" class="login-input" id="regPhone" required>
                </div>

                <button type="submit" class="btn-play login-btn">ส่งคำขอรับบัญชีหาเทพ</button>
            </form>    

            <div class="login-footer">
                <p>มีบัญชีอยู่แล้ว? <a href="login.html" style="color: var(--accent-orange); text-decoration: none;">กลับไปหน้าเข้าสู่ระบบ</a></p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
